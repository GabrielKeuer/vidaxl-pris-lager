name: Eurofirany Inventory Sync
# Lager (grænse: < 5 stk = udsolgt) + priser (gardiner bund 149, tæpper bund 299) – Omar 9/10

on:
  # Eurofiranys integrationsfeed (fullSpecification.csv, nøgle i secret EUROFIRANY_FEED_KEY) – genereres live (no-cache).
  # Hver time på minut 17 (Omar 9/10: 'hente en gang i timen, så det er up to date'); skævt minut = mindre GitHub-forsinkelse.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Kun rapportér (ingen ændringer)'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write

concurrency:
  group: eurofirany-inventory-sync
  cancel-in-progress: true

jobs:
  sync-eurofirany:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔄 Sync Eurofirany inventory
        env:
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          EUROFIRANY_FEED_KEY: ${{ secrets.EUROFIRANY_FEED_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EF_MIN_STOCK: '5'
        run: |
          python scripts/sync_eurofirany_inventory.py

      - name: 🔔 Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ Eurofirany Inventory Sync Failed',
              body: `Eurofirany inventory sync failed at ${new Date().toISOString()}\n\nCheck the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`,
              labels: ['eurofirany', 'bug', 'automated']
            })

